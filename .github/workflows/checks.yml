name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12 --extra dev --extra media --extra semantic --extra mcp --extra bot
      - name: Tests
        run: uv run --no-sync pytest -q
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Verify Windows launch script syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$pwd\scripts\windows.ps1", [ref]$parseTokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Smoke test local processors and CLI in a Unicode path
        run: uv run --no-sync python scripts/smoke.py
