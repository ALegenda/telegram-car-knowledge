[project]
name = "tg-knowledge"
version = "0.2.0"
description = "Local Telegram forum archive and evidence search for car owners"
requires-python = ">=3.11,<3.14"
dependencies = [
    "telethon>=1.45,<2",
    "python-dotenv>=1.0,<2",
    "qrcode[pil]>=8,<9",
    "snowballstemmer>=3,<4",
    "pypdf>=6,<7",
    "cryptg>=0.5,<1",
    "filelock>=3.20,<4",
    "psutil>=7,<8",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5,<6", "numpy>=1.26,<3"]
mcp = ["mcp>=1.20,<2"]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]
media = [
    "pymupdf>=1.26,<2",
    "easyocr>=1.7,<2",
    "faster-whisper>=1.2,<2",
    "imageio-ffmpeg>=0.6,<1",
]

[project.scripts]
tg-knowledge = "tg_knowledge.cli:main"
tg-knowledge-setup = "tg_knowledge.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

# Use CPU wheels on Windows/Linux: no CUDA installation or NVIDIA GPU is required.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
